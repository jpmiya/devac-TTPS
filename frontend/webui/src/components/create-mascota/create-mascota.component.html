<div class="page">

  <!-- LOADING USER -->
  <div class="loading-overlay" *ngIf="loadingUser">
    <div class="spinner"></div>
    <div class="loading-text">Verificando sesión...</div>
  </div>

  <!-- LOADING SUBMIT -->
  <div class="loading-overlay" *ngIf="loading">
    <div class="spinner"></div>
    <div class="loading-text">Creando aviso...</div>
  </div>

  <button type="button" class="btn-back" (click)="goBack()">← Volver</button>

  <!-- HEADER -->
  <header class="topbar">
    <div class="topbar-left">
      <h1>Nuevo aviso de mascota</h1>
      <p>Completá los datos para publicar el aviso</p>
    </div>
  </header>

  <!-- ERROR / OK -->
  <div class="error-banner" *ngIf="!loading && error">
    {{ error }}
  </div>

  <div class="ok-banner" *ngIf="!loading && ok">
    {{ ok }}
  </div>

  <!-- FORM CARD -->
  <section class="card" *ngIf="!loadingUser">
    <form class="form" (ngSubmit)="submit()">

      <div class="field">
        <label class="label">Nombre *</label>
        <input class="input" [(ngModel)]="form.nombre" name="nombre" placeholder="Ej: Firulais" required />
      </div>

      <div class="field">
        <label class="label">Tipo *</label>
        <select class="select" [(ngModel)]="form.tipo" name="tipo" required>
          <option value="Perro">Perro</option>
          <option value="Gato">Gato</option>
          <option value="Otro">Otro</option>
        </select>
      </div>

      <div class="field">
        <label class="label">Raza</label>
        <input class="input" [(ngModel)]="form.raza" name="raza" placeholder="Ej: Labrador" />
      </div>

      <div class="field">
        <label class="label">Tamaño</label>
        <select class="select" [(ngModel)]="form.tamanio" name="tamanio">
          <option value="">Seleccionar...</option>
          <option value="Pequeño">Pequeño</option>
          <option value="Mediano">Mediano</option>
          <option value="Grande">Grande</option>
        </select>
      </div>

      <div class="field">
        <label class="label">Color</label>
        <input class="input" [(ngModel)]="form.color" name="color" placeholder="Ej: Marrón" />
      </div>

      <div class="field">
        <label class="label">Fecha de pérdida *</label>
        <input
          class="input"
          type="date"
          [(ngModel)]="form.fechaDePerdida"
          name="fechaDePerdida"
          required
        />
      </div>

      <div class="field">
        <label class="label">Estado *</label>
        <select class="select" [(ngModel)]="form.estado" name="estado" required>
          <option value="PERDIDO_PROPIO">Perdido (mi mascota)</option>
          <option value="ADOPTADO">En adopción</option>
        </select>
      </div>

      <div class="field full">
        <label class="label">Descripción</label>
        <textarea
          class="input"
          [(ngModel)]="form.descripcion"
          name="descripcion"
          rows="4"
          placeholder="Detalles adicionales que puedan ayudar a identificar a la mascota..."
        ></textarea>
      </div>

      <div class="field full">
        <label class="label">Ubicación</label>
        <span class="hint">Seleccioná en el mapa dónde se perdió/encontró la mascota.</span>
        <app-location-picker (coordsString)="onLocationSelected($event)"></app-location-picker>
        <small class="coords-preview" *ngIf="form.coordenadas">Enviando: {{ form.coordenadas }}</small>
      </div>

      <div class="field full">
        <label class="label">Foto</label>
        <input
          class="input"
          type="file"
          accept="image/*"
          (change)="onFileSelected($event)"
          name="fotoFile"
        />
        <small style="color: #888; margin-top: 4px; display: block;">Formatos: JPG, PNG, GIF. Tamaño máximo: 5MB</small>
      </div>

      <div class="actions full">
        <button type="button" class="ghost" routerLink="/lost-dogs">Cancelar</button>
        <button type="submit" class="secondary" [disabled]="loading || loadingUser">Publicar aviso</button>
      </div>

    </form>
  </section>

</div>
