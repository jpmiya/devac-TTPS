<div class="login-container">
  <!-- HERO -->
  <div class="hero-content">
    <h1 class="hero-title">¿Dónde estás?<br>Volvé a casa</h1>
    <p class="hero-subtitle">Plataforma colaborativa para búsqueda de mascotas perdidas</p>
  </div>

  <!-- LOGIN CARD -->
  <div class="login-card">
    <button type="button" class="btn-back" (click)="goBack()">← Volver</button>
    <h2>Iniciar Sesión</h2>

    <!-- Banner de error -->
    <div class="error-banner" *ngIf="errorMessage()">
      {{ errorMessage() }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="tu@email.com"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
        <div class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <small *ngIf="loginForm.get('email')?.errors?.['required']">El email es requerido</small>
          <small *ngIf="loginForm.get('email')?.errors?.['email']">Email inválido</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="********"
            [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="showPassword.set(!showPassword())"
            tabindex="-1"
          >
            {{ showPassword() ? '🙈' : '👁️' }}
          </button>
        </div>
        <div class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <small>La contraseña es requerida</small>
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading()">
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>

<style>
  .login-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 2rem 1rem;
    background: var(--gradient-brand);
    gap: 2rem;
  }

  .hero-content {
    text-align: center;
    color: white;
    background: rgba(0, 0, 0, 0.15);
    padding: 40px 60px;
    border-radius: var(--radius-xl);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    max-width: 500px;
    width: 100%;
  }

  .hero-title {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 0.75rem;
    line-height: 1.2;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
  }

  .hero-subtitle {
    font-size: 1.05rem;
    opacity: 0.9;
  }

  .login-card {
    background: var(--color-surface);
    padding: 2rem;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    width: 100%;
    max-width: 400px;
  }

  h2 {
    text-align: center;
    color: var(--color-text);
    margin-bottom: 1.5rem;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--color-text-muted);
    font-weight: 500;
  }

  input {
    width: 100%;
    padding: 0.75rem;
    border: 2px solid #ddd;
    border-radius: 5px;
    font-size: 1rem;
    transition: border-color 0.3s;
    box-sizing: border-box;
  }

  input:focus {
    outline: none;
    border-color: var(--color-primary);
  }

  input.invalid {
    border-color: var(--color-error);
  }

  .error {
    margin-top: 0.25rem;
  }

  .error small {
    color: var(--color-error);
    font-size: 0.875rem;
  }

  .password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .password-wrapper input {
    padding-right: 2.75rem;
  }

  .toggle-password {
    position: absolute;
    right: 0.5rem;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.2rem;
    padding: 0.25rem;
    line-height: 1;
    width: auto;
    opacity: 0.7;
    transition: opacity 0.2s;
  }

  .toggle-password:hover {
    opacity: 1;
    transform: none;
  }

  button[type="submit"] {
    width: 100%;
    padding: 0.75rem;
    background: var(--gradient-brand);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  button[type="submit"]:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
  }

  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>
