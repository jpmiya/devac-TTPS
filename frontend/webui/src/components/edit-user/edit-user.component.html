<div class="edit-user-page">

  <!-- HEADER -->
  <header class="header">
    <nav class="nav">
      <a routerLink="/" class="nav-link">Home</a>
      <a routerLink="/ranking" class="nav-link">Ranking Colaboradores</a>
      <a routerLink="/lost-dogs" class="nav-link highlight">Ver mascotas perdidas en tu zona</a>


      <!-- HEADER
      <div class="nav-buttons">
        <a routerLink="/profile" class="nav-btn outline">Volver</a>
        <button class="nav-btn" type="button" (click)="logout?.()">Cerrar sesión</button>
      </div>
      -->
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title">Editar perfil</h1>
      <p class="hero-subtitle">Actualizá tus datos para que podamos contactarte más fácil</p>
    </div>
  </section>

  <!-- FORM -->
  <section class="form-section">
    <div class="form-container">

      <div class="form-card">
        <div class="card-header">
          <h2 class="card-title">Tus datos</h2>
          <p class="card-subtitle">Podés cambiar los campos que quieras y guardar.</p>
        </div>

        <!-- Si usás Reactive Forms: [formGroup]="form" --><form class="form" [formGroup]="form" (ngSubmit)="save()">
        <div class="grid">

          <div class="field">
            <label class="label" for="nombreYApellido">Nombre y apellido</label>
            <input
              id="nombreYApellido"
              class="input"
              type="text"
              formControlName="nombreYApellido"
              placeholder="Ej: Nicolás Beiserman"
              autocomplete="name"
            />
          </div>

          <div class="field">
            <label class="label" for="email">Email</label>
            <input
              id="email"
              class="input"
              type="email"
              formControlName="email"
              placeholder="tu@email.com"
              autocomplete="email"
            />
          </div>

          <div class="field">
            <label class="label" for="telefono">Teléfono</label>
            <input
              id="telefono"
              class="input"
              type="tel"
              formControlName="telefono"
              placeholder="Ej: +54 9 221 555-1234"
              autocomplete="tel"
            />
          </div>

          <div class="field">
            <label class="label" for="barrio">Barrio</label>
            <input
              id="barrio"
              class="input"
              type="text"
              formControlName="barrio"
              placeholder="Ej: Gonnet"
              autocomplete="address-level3"
            />
          </div>

          <div class="field">
            <label class="label" for="ciudad">Ciudad</label>
            <input
              id="ciudad"
              class="input"
              type="text"
              formControlName="ciudad"
              placeholder="Ej: La Plata"
              autocomplete="address-level2"
            />
          </div>

        </div>

        <!-- Acciones -->
        <div class="actions">
          <button class="nav-btn outline" type="button" (click)="cancel()">Cancelar</button>
          <button class="nav-btn primary" type="submit" [disabled]="saving || loading">
            Guardar cambios
          </button>
        </div>

        <!-- Mensajes -->
        <div class="status" *ngIf="successMessage">{{ successMessage }}</div>
        <div class="status error" *ngIf="errorMessage">{{ errorMessage }}</div>
      </form>

      </div>

    </div>
  </section>
</div>
